x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orken_life}
      POSTGRES_USER: ${POSTGRES_USER:-orken}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - orken_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orken} -d ${POSTGRES_DB:-orken_life}"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - orken_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-orken}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orken_life}
      REDIS_URL: redis://redis:6379
      APP_ORIGIN: ${APP_ORIGIN:-https://orken.life}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://orken.life}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ADMIN_API_TOKEN is required}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      DEV_TOOLS_ENABLED: "false"
      LOCAL_UPLOADS_ENABLED: ${LOCAL_UPLOADS_ENABLED:-true}
      LOCAL_UPLOAD_DIR: /repo/.runtime/uploads
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-levelup-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PRICE_AMOUNT: ${PRICE_AMOUNT:-300}
      PRICE_CURRENCY: ${PRICE_CURRENCY:-usd}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-ORKEN.LIFE <reports@orken.life>}
      ORKEN_LLM_API_KEY: ${ORKEN_LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://10.100.50.9:8000/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-whisper-1}
      OPENAI_REQUEST_TIMEOUT_MS: ${OPENAI_REQUEST_TIMEOUT_MS:-300000}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-9000}
      OPENAI_ASYNC_REPORTS_ENABLED: ${OPENAI_ASYNC_REPORTS_ENABLED:-true}
      OPENAI_ASYNC_TIMEOUT_MS: ${OPENAI_ASYNC_TIMEOUT_MS:-600000}
      OPENAI_ASYNC_POLL_INTERVAL_MS: ${OPENAI_ASYNC_POLL_INTERVAL_MS:-5000}
      AI_REPORT_FALLBACK_ENABLED: ${AI_REPORT_FALLBACK_ENABLED:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-6}
      PARTNER_CORE_URL: ${PARTNER_CORE_URL:-}
      PARTNER_CORE_SERVICE_KEYS_JSON: ${PARTNER_CORE_SERVICE_KEYS_JSON:-}
      PARTNER_CORE_KEY_ID: ${PARTNER_CORE_KEY_ID:-}
      PARTNER_CORE_SERVICE_SECRET: ${PARTNER_CORE_SERVICE_SECRET:-}
      PARTNER_CORE_PROJECT_ID: ${PARTNER_CORE_PROJECT_ID:-orken-life}
      PARTNER_CORE_DEFAULT_PROGRAM_ID: ${PARTNER_CORE_DEFAULT_PROGRAM_ID:-prog-orken-life}
      PARTNER_CORE_EMBED_ORIGIN: ${PARTNER_CORE_EMBED_ORIGIN:-https://orken.life}
      PARTNER_CORE_PRIVACY_SECRET: ${PARTNER_CORE_PRIVACY_SECRET:-}
      PARTNER_PORTAL_ORIGIN: ${PARTNER_PORTAL_ORIGIN:-https://orken.life}
      PARTNER_PORTAL_SESSION_ENCRYPTION_SECRET: ${PARTNER_PORTAL_SESSION_ENCRYPTION_SECRET:-}
      PARTNER_PORTAL_COOKIE_DOMAIN: ${PARTNER_PORTAL_COOKIE_DOMAIN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      DOCS_ACCESS_PASSWORD: ${DOCS_ACCESS_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3111:3001"
    volumes:
      - orken_uploads:/repo/.runtime/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    command: npm --workspace apps/backend run worker
    logging: *default-logging
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-orken}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orken_life}
      REDIS_URL: redis://redis:6379
      APP_ORIGIN: ${APP_ORIGIN:-https://orken.life}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://orken.life}
      LOCAL_UPLOADS_ENABLED: ${LOCAL_UPLOADS_ENABLED:-true}
      LOCAL_UPLOAD_DIR: /repo/.runtime/uploads
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-levelup-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      ORKEN_LLM_API_KEY: ${ORKEN_LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://10.100.50.9:8000/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-whisper-1}
      OPENAI_REQUEST_TIMEOUT_MS: ${OPENAI_REQUEST_TIMEOUT_MS:-300000}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-9000}
      OPENAI_ASYNC_REPORTS_ENABLED: ${OPENAI_ASYNC_REPORTS_ENABLED:-true}
      OPENAI_ASYNC_TIMEOUT_MS: ${OPENAI_ASYNC_TIMEOUT_MS:-600000}
      OPENAI_ASYNC_POLL_INTERVAL_MS: ${OPENAI_ASYNC_POLL_INTERVAL_MS:-5000}
      AI_REPORT_FALLBACK_ENABLED: ${AI_REPORT_FALLBACK_ENABLED:-true}
      ANALYSIS_WORKER_CONCURRENCY: ${ANALYSIS_WORKER_CONCURRENCY:-1}
      PARTNER_CORE_URL: ${PARTNER_CORE_URL:-}
      PARTNER_CORE_SERVICE_KEYS_JSON: ${PARTNER_CORE_SERVICE_KEYS_JSON:-}
      PARTNER_CORE_KEY_ID: ${PARTNER_CORE_KEY_ID:-}
      PARTNER_CORE_SERVICE_SECRET: ${PARTNER_CORE_SERVICE_SECRET:-}
      PARTNER_CORE_PROJECT_ID: ${PARTNER_CORE_PROJECT_ID:-orken-life}
      PARTNER_CORE_DEFAULT_PROGRAM_ID: ${PARTNER_CORE_DEFAULT_PROGRAM_ID:-prog-orken-life}
      PARTNER_CORE_EMBED_ORIGIN: ${PARTNER_CORE_EMBED_ORIGIN:-https://orken.life}
      PARTNER_CORE_PRIVACY_SECRET: ${PARTNER_CORE_PRIVACY_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - orken_uploads:/repo/.runtime/uploads

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://orken.life}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://orken.life}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3110:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  orken_pg_data:
  orken_redis_data:
  orken_uploads:
